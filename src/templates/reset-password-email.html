<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Reset password</title>
</head>

<body>
    <p>Hello {{username}},</p>
    <p>We received a request to reset your password. Click the link below to set a new password. This link will expire
        in 15 minutes.</p>
    <p><a href="{{resetLink}}">Reset your password</a></p>
    <p>If you didn't request a password reset, please ignore this email.</p>
    <p>Best regards,<br />Your Team</p>
</body>

</html>
